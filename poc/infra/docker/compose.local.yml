# ローカル結合テスト用 (ACA 相当のトポロジをローカルで再現)
#   docker compose -f infra/docker/compose.local.yml up --build
# 全ポートは 127.0.0.1 のみに bind (メモ §4/§6 のセキュリティ制約)
services:
  excalidraw-mcp:
    build:
      context: ../../my-mcp-server/mcp_excalidraw
      dockerfile: ../../infra/docker/Dockerfile.excalidraw
    ports:
      - "127.0.0.1:3000:3000"   # canvas UI (目視確認用)
      - "127.0.0.1:8000:8000"   # /mcp + /healthz
  cc-tools:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.cctools
    environment:
      EXCALIDRAW_MCP_URL: http://excalidraw-mcp:8000/mcp
    ports:
      - "127.0.0.1:8080:8080"   # cc-tools /mcp
    depends_on:
      - excalidraw-mcp
