[project]
name = "concept-cartographer"
version = "1.0.0"
description = "Concept Cartographer 実運用版 (R1): 可変詳細度つき概念地図生成パイプライン"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "mcp>=1.9,<2",  # 2.0 は API 再編 + cryptography 依存 (x86_64 wheel が壊れている) のため 1.x に固定
    "anyio>=4.0",
    "httpx>=0.27",  # cc_orchestrator (Foundry REST / Graph)
    "pypdf>=4.0",   # cc_orchestrator.ingest (PDF テキスト抽出)
    "networkx>=3.2",     # 中心性計算 (可変詳細度の重要度スコア)
    "leidenalg>=0.10",   # Leiden コミュニティ検出 (v3 §2.4)
    "igraph>=0.11",      # leidenalg のグラフ表現
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
ingest = [
    "pypdf>=4.0",  # scripts/extract_pdf_text.py (PDF -> テキスト)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: requires local canvas server (127.0.0.1:3000) and streamable HTTP gateway (127.0.0.1:8000/mcp)",
]
