<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept Cartographer</title>
<!-- 閉域でも動くよう外部 CDN・Web フォントは使わない (設計書 §1) -->
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- ========== アイコンスプライト (Tabler 風 24x24 stroke=2 を手書き移植) ========== -->

    <symbol id="i-history" viewBox="0 0 24 24">
      <path d="M12 8v4l2 2"/>
      <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24">

    <symbol id="i-file-docx" viewBox="0 0 24 24">

      <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/>
      <text x="12" y="18" font-size="7.5" font-weight="600" text-anchor="middle"
            fill="currentColor" stroke="none">W</text>
    </symbol>
    <symbol id="i-file-xls" viewBox="0 0 24 24">

      <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/>

            fill="currentColor" stroke="none">X</text>
    </symbol>
    <symbol id="i-file-text" viewBox="0 0 24 24">
      <path d="M14 3v4a1 1 0 0 0 1 1h4"/>

    <symbol id="i-help" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M12 17v.01"/>
      <path d="M12 13.5a1.5 1.5 0 0 1 1 -1.5a2.6 2.6 0 1 0 -3 -4"/>
    </symbol>

    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <path d="M10.3 4.3c.4 -1.8 2.9 -1.8 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.5 -.9 3.3 .8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8 .4 1.8 2.9 0 3.4a1.7 1.7 0 0 0 -1 2.6c.9 1.5 -.8 3.3 -2.4 2.4a1.7 1.7 0 0 0 -2.6 1c-.4 1.8 -2.9 1.8 -3.4 0a1.7 1.7 0 0 0 -2.6 -1c-1.5 .9 -3.3 -.8 -2.4 -2.4a1.7 1.7 0 0 0 -1 -2.6c-1.8 -.4 -1.8 -2.9 0 -3.4a1.7 1.7 0 0 0 1 -2.5c-.9 -1.6 .9 -3.3 2.4 -2.4c1 .6 2.3 .1 2.6 -1.1z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="i-chevrons-left" viewBox="0 0 24 24">
      <path d="M11 7l-5 5l5 5M17 7l-5 5l5 5"/>

    <symbol id="i-chevrons-right" viewBox="0 0 24 24">

      <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/>
    </symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6l6 -6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6l-6 6"/></symbol>
    <symbol id="i-info-circle" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M12 8v.01"/><path d="M11 12h1v4h1"/>
    </symbol>
    <symbol id="i-map-2" viewBox="0 0 24 24">
      <path d="M9 4l-5 2.5v13l5 -2.5l6 3l5 -2.5v-13l-5 2.5z"/>
      <path d="M9 4v13M15 7v13"/>
    </symbol>
    <symbol id="i-hierarchy-2" viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
      <path d="M12 7v4M5 11h14M5 11v6M19 11v6"/>
    </symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24">
      <path d="M3 12h1M12 3v1M20 12h1M5.6 5.6l.7 .7M18.4 5.6l-.7 .7"/>
      <path d="M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0 -1 3a2 2 0 0 1 -4 0a3.5 3.5 0 0 0 -1 -3"/>
      <path d="M9.7 17h4.6"/>
    </symbol>
    <symbol id="i-chart-dots-3" viewBox="0 0 24 24">
      <circle cx="7" cy="17" r="2"/><circle cx="12" cy="8" r="2"/><circle cx="18" cy="14" r="2"/>
      <path d="M8 15.2l3 -5.4M13.6 9.3l3 3.4"/>
    </symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24">

    </symbol>
    <symbol id="i-world" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8"/>
      <path d="M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
      <path d="M10 14l11 -11"/>
      <path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1z"/>
    </symbol>
    <symbol id="i-circle-check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M9 12l2 2l4 -4"/>
    </symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></symbol>
    <symbol id="i-circle-x" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M10 10l4 4M14 10l-4 4"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6l-12 12M6 6l12 12"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24">
      <path d="M12 17.75l-6.17 3.25l1.18 -6.88l-5 -4.87l6.9 -1l3.09 -6.25l3.09 6.25l6.9 1l-5 4.87l1.18 6.88z"/>
    </symbol>
    <symbol id="i-star-filled" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 17.75l-6.17 3.25l1.18 -6.88l-5 -4.87l6.9 -1l3.09 -6.25l3.09 6.25l6.9 1l-5 4.87l1.18 6.88z"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2M4 5v4h4"/>
      <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"/>
      <path d="M7 11l5 5l5 -5M12 4v12"/>
    </symbol>
    <symbol id="i-loader-2" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
    <!-- 編集モード用 -->
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4 7h16M10 11v6M14 11v6"/>

    </symbol>
    <symbol id="i-arrows-exchange" viewBox="0 0 24 24">
      <path d="M7 10h14l-4 -4M17 14h-14l4 4"/>
    </symbol>
    <symbol id="i-arrow-back-up" viewBox="0 0 24 24">
      <path d="M9 13l-4 -4l4 -4"/>
      <path d="M5 9h11a4 4 0 0 1 0 8h-1"/>
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24">
      <path d="M9 15l6 -6"/>
      <path d="M11 6l.5 -.5a3.5 3.5 0 0 1 5 5l-.5 .5"/>
      <path d="M13 18l-.5 .5a3.5 3.5 0 0 1 -5 -5l.5 -.5"/>

      <path d="M12 4l10 5l-10 5l-10 -5z"/>

</svg>

<!-- ================================ サイドバー ================================ -->
<aside class="sidebar" id="sidebar">
  <div class="logo">
    <img class="logo-mark" src="/static/logo.png" alt="Concept Cartographer のロゴ" width="42" height="42">
    <p class="logo-text">Concept<br>Cartographer</p>
  </div>

  <button class="side-item active" id="btn-new-chat" type="button">
    <svg class="ic ic-14"><use href="#i-edit"/></svg> 新しいチャット
  </button>

  <div class="side-head"><svg class="ic ic-14"><use href="#i-history"/></svg> チャット履歴</div>
  <div id="history-list"></div>
  <button class="side-more" id="btn-history-more" type="button">すべて表示</button>

  <div class="side-sep"></div>
  <div class="side-head"><svg class="ic ic-14"><use href="#i-folder"/></svg> アップロードしたファイル</div>
  <div id="file-list"></div>
  <button class="side-more link" id="btn-upload-side" type="button">すべてのファイルを表示</button>

  <div class="side-bottom">
    <div class="side-sep"></div>
    <button class="side-item" id="btn-help" type="button">
      <svg class="ic ic-14"><use href="#i-help"/></svg> ヘルプ
    </button>
    <button class="side-item" id="btn-feedback" type="button">
      <svg class="ic ic-14"><use href="#i-message-2"/></svg> フィードバック
    </button>
    <button class="side-item" id="btn-settings" type="button">
      <svg class="ic ic-14"><use href="#i-settings"/></svg> 設定
    </button>
    <button class="side-collapse" id="btn-collapse" type="button">
      <svg class="ic ic-13"><use href="#i-chevrons-left"/></svg> サイドバーを閉じる
    </button>
  </div>
</aside>
<button class="sidebar-reopen" id="btn-reopen" type="button" title="サイドバーを開く" hidden>
  <svg class="ic ic-14"><use href="#i-chevrons-right"/></svg>
</button>
<!-- 狭幅でサイドバーをドロワーとして開いている間だけ出る下敷き (クリックで閉じる) -->
<div id="drawer-scrim" hidden></div>

<!-- ================================== メイン ================================== -->
<main class="main">
  <header class="hdr">
    <div class="hdr-card mode-card">
      <div class="avatar indigo"><svg class="ic ic-16"><use href="#i-user"/></svg></div>
      <div class="min0">
        <button class="hdr-title" id="btn-mode" type="button" aria-haspopup="true">
          モード: 個人モード <svg class="ic ic-12"><use href="#i-chevron-down"/></svg>
        </button>
        <p class="hdr-sub">自分専用の作業スペースで、個人の研究を整理・可視化します</p>
      </div>
      <button class="hdr-info" id="btn-info-mode" type="button"
              aria-label="モードの説明" title="モードの説明">
        <svg class="ic ic-14"><use href="#i-info-circle"/></svg>
      </button>
    </div>

    <div class="hdr-card level-card">
      <div class="min0">
        <p class="hdr-label">詳細度</p>
        <div class="seg" role="group" aria-label="詳細度">
          <button class="seg-btn" data-level="overview" type="button">Overview</button>
          <button class="seg-btn is-on" data-level="standard" type="button">Standard</button>
          <button class="seg-btn" data-level="detailed" type="button">Detailed</button>
        </div>
        <p class="lv-counts" id="lv-counts"></p>
      </div>
      <button class="hdr-info" id="btn-info-level" type="button"
              aria-label="詳細度の説明" title="詳細度の説明">
        <svg class="ic ic-14"><use href="#i-info-circle"/></svg>
      </button>
    </div>

    <div class="hdr-card acct-card">
      <div class="avatar green" id="acct-initials">··</div>
      <div class="min0">
        <button class="hdr-title" id="btn-account" type="button" aria-haspopup="true">
          <span id="acct-name">読み込み中…</span>
          <svg class="ic ic-12"><use href="#i-chevron-down"/></svg>
        </button>
        <p class="hdr-sub" id="acct-domain"></p>
        <p class="hdr-signed" id="acct-signed">
          <svg class="ic ic-12"><use href="#i-circle-check"/></svg> Microsoft 365 でサインイン中
        </p>
      </div>
    </div>
  </header>

  <div class="content" id="content">
    <!-- ホームビュー -->
    <section id="home">
      <div class="hero">
        <h1 class="grad-title">Concept Cartographer</h1>
        <p class="hero-sub">研究の断片をつなぎ、意味ある全体像へ</p>
      </div>
      <p class="section-label">試してみる</p>
      <div class="tpl-grid" id="tpl-grid"></div>
      <p class="tpl-more">
        <button type="button" class="linkbtn" id="btn-tpl-more">
          すべてのテンプレートを表示 <svg class="ic ic-12"><use href="#i-chevron-right"/></svg>
        </button>
      </p>
    </section>

    <!-- セッションビュー (送信後) -->
    <section id="thread" hidden></section>
  </div>

  <footer class="composer">
    <!-- このページで扱っている添付資料 (アップロード直後に見える手応えを出す) -->
    <div class="attach-row" id="attach-row" hidden></div>
    <div class="composer-box">
      <textarea id="composer-input" rows="1"
                placeholder="研究について何でも聞いてください..."></textarea>
      <div class="composer-row">
        <div class="composer-tools">
          <button class="chip" id="btn-upload" type="button">
            <svg class="ic ic-13"><use href="#i-paperclip"/></svg> ファイルをアップロード
            <svg class="ic ic-11 faint"><use href="#i-chevron-down"/></svg>
          </button>
          <button class="chip icon-only" id="btn-workiq" type="button"
                  title="Work IQ (OneDrive/SharePoint) から資料を収集">
            <svg class="ic ic-14"><use href="#i-world"/></svg>
          </button>
        </div>
        <button class="send" id="btn-send" type="button" title="送信">
          <svg class="ic ic-15"><use href="#i-send"/></svg>
        </button>
      </div>
    </div>
    <p class="disclaimer">
      AI が生成した回答は必ずしも正確とは限りません。重要な情報はご自身でご確認ください。
      <button type="button" class="linkbtn" id="btn-about">詳細情報</button>
    </p>
    <input type="file" id="file-input" multiple accept=".pdf,.docx,.txt,.md" hidden>
  </footer>
</main>

<!-- ============================ 重ね置き UI ============================ -->
<div class="dropdown" id="mode-menu" hidden>
  <button type="button" class="dd-item is-on">個人モード <span class="dd-check">✓</span></button>
  <button type="button" class="dd-item" disabled title="計画 R3">チームモード (準備中)</button>
  <button type="button" class="dd-item" disabled title="計画 R3">機構横断モード (準備中)</button>
</div>

<!-- アカウントのメニュー。中身はサインイン状態で変わるので app.js が組み立てる -->
<div class="dropdown" id="acct-menu" hidden></div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <p class="modal-title" id="modal-title"></p>
      <button class="icon-btn" id="modal-close" type="button" title="閉じる">
        <svg class="ic ic-14"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="popover" id="popover" hidden></div>
<div class="popover info-pop" id="info-pop" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
